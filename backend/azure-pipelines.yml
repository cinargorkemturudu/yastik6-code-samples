trigger:
- main

stages:
- stage: Test
  displayName: 'Run backend test suite'
  jobs:
  - job: DotnetTest
    pool:
      name: 'yastik6'
    container: mcr.microsoft.com/dotnet/sdk:10.0.100
    steps:
    - script: dotnet test Yastik6.Backend.sln --configuration Release
      displayName: 'dotnet test'

- stage: Deploy
  displayName: 'Deploy to production'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: SSHDeploy
    pool:
      name: 'yastik6'
    steps:
    - task: SSH@0
      displayName: 'Update code on the server and restart'
      inputs:
        sshEndpoint: 'Oracle-Server-Service-Connection'
        runOptions: 'inline'
        inline: |
          set -e
          cd ~/Isolated-Backend-Yastik6
          git pull 2>&1
          sudo docker compose down 2>&1
          sudo docker compose up -d --build 2>&1
